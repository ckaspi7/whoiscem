name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 6am UTC for eval job
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Run integration tests
        # Embedded Qdrant — no service containers needed.
        run: pytest tests/integration/ -v --tb=short
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QDRANT_MODE: embedded

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t whoiscem:ci .

      - name: Assert no secrets or personal data baked into the image
        run: |
          set -euo pipefail
          for path in /app/.env /app/data/user_data.db /app/data/seed_data.json /app/.git; do
            if docker run --rm --entrypoint sh whoiscem:ci -c "[ -e $path ]"; then
              echo "::error::$path is present in the image"
              exit 1
            fi
          done
          echo "image is clean"

      - name: Verify compose healthchecks
        # The Qdrant and Redis healthchecks cannot be exercised on the dev
        # machine, which has no container runtime. This is where they are real.
        run: |
          set -euo pipefail
          # compose parses env_file for every service, so the file must exist.
          # Only qdrant and redis start here, so the value is never used.
          echo "OPENAI_API_KEY=unused-by-this-job" > .env
          docker compose up -d qdrant redis
          for i in $(seq 1 30); do
            qdrant=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q qdrant)")
            redis=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q redis)")
            echo "attempt $i: qdrant=$qdrant redis=$redis"
            if [ "$qdrant" = healthy ] && [ "$redis" = healthy ]; then exit 0; fi
            if [ "$qdrant" = unhealthy ] || [ "$redis" = unhealthy ]; then break; fi
            sleep 5
          done
          echo "::error::services did not become healthy"
          docker compose logs --tail=50
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        # Pinned like every other dependency: ruff's default rule set widens
        # between releases, and an unpinned linter turns green commits red.
        run: pip install ruff==0.16.8

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

  # Fast gate on every change: routing and retrieval, no judge calls. Catches a
  # regression in minutes and for cents; the full RAGAS pass is 59 questions
  # times four judged metrics and belongs on a schedule.
  eval-gate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache the cross-encoder
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('requirements.txt') }}

      - name: Check for an API key
        id: key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            # Loud rather than silent. A gate that quietly stops running is
            # worse than no gate: the build stays green and nothing is checked.
            echo "::warning title=Evaluation gate did not run::OPENAI_API_KEY is not set on this repository, so routing and retrieval were not evaluated. Add the secret in Settings > Secrets and variables > Actions."
            echo "### Evaluation gate skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`OPENAI_API_KEY\` is not configured, so no routing or retrieval check ran on this commit." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run routing and retrieval evaluation
        if: steps.key.outputs.present == 'true'
        run: python eval/run_eval.py --no-ragas --output eval/results/pr-run.json
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QDRANT_MODE: embedded

      - name: Compare against the committed baseline
        if: steps.key.outputs.present == 'true'
        run: |
          python eval/compare.py --current eval/results/pr-run.json | tee "$GITHUB_STEP_SUMMARY.tmp"
          {
            echo "### Evaluation gate"
            echo ""
            echo '```'
            cat "$GITHUB_STEP_SUMMARY.tmp"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-gate-run
          path: eval/results/pr-run.json

  eval:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    services:
      qdrant:
        image: qdrant/qdrant:v1.9.2
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for an API key
        id: key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Scheduled evaluation did not run::OPENAI_API_KEY is not set on this repository."
          fi

      - name: Wait for Qdrant to be ready
        # services: starts the container; it does not wait for the app inside
        # it to accept connections. Polled from the runner, which can reach
        # the published port directly — no need for a client inside the
        # image, which ships none. Likely root cause of one real failure: the
        # scheduled run on 2026-09-21 passed "Run full evaluation" but failed
        # "Compare against the committed baseline", meaning the eval completed
        # but scored far below tolerance — consistent with the first resume
        # query racing a not-yet-ready Qdrant and poisoning the retrieval
        # singleton for the rest of that run (fixed separately in
        # tools/resume_tool.py, which now self-heals from exactly this).
        if: steps.key.outputs.present == 'true'
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:6333/readyz > /dev/null 2>&1; then
              echo "Qdrant ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Qdrant did not become ready within 30s"
          exit 1

      - name: Run full evaluation
        if: steps.key.outputs.present == 'true'
        run: python eval/run_eval.py --output eval/results/scheduled-run.json
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QDRANT_MODE: server
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333

      - name: Compare against the committed baseline
        if: steps.key.outputs.present == 'true'
        run: python eval/compare.py --current eval/results/scheduled-run.json

      - name: Upload eval results
        if: always() && steps.key.outputs.present == 'true' 
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/scheduled-run.json
