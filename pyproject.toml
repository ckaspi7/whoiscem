[project]
name = "whoiscem"
version = "0.1.0"
description = "Personal RAG chatbot and AI engineering portfolio"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = [".venv", ".qdrant", "eval/results"]

[tool.ruff.lint]
# Explicit rather than inherited: ruff's default set widens between releases,
# which is how CI went red on a commit that changed no Python.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
]

[tool.ruff.lint.isort]
# Without this, ruff sorts `config` as a third-party package.
known-first-party = [
    "config", "chatbot", "router",
    "retrieval", "tools", "memory", "guardrails", "eval", "scripts",
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = ["integration: marks tests that require external services (Qdrant, Redis)"]
