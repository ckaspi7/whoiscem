[project]
name = "whoiscem"
version = "0.1.0"
description = "Personal RAG chatbot and AI engineering portfolio"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = [".venv", ".qdrant", "eval/results"]

[tool.ruff.lint]
# Explicit rather than inherited: ruff's default set widens between releases,
# which is how CI went red on a commit that changed no Python.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
]

[tool.ruff.lint.per-file-ignores]
# Effectively a data file: ground-truth answers are prose, and wrapping them
# mid-sentence makes the golden set harder to read and review than it is to lint.
"eval/build_golden_set.py" = ["E501"]

[tool.ruff.lint.isort]
# Without this, ruff sorts `config` as a third-party package.
known-first-party = [
    "config", "chatbot", "router",
    "retrieval", "tools", "memory", "guardrails", "eval", "scripts",
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
# Put the repo root on sys.path. Without it, `pytest` fails at collection on
# every first-party import, while `python -m pytest` succeeds because that form
# adds the working directory itself. CI runs the bare form, so the test job was
# red from the first commit while the suite passed on every developer machine.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = ["integration: marks tests that require external services (Qdrant, Redis)"]
